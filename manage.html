<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#13251f" />
    <title>Quản lý · Kế hoạch của cháu</title>
    <meta name="description" content="Khôi phục hoặc import kế hoạch cá nhân." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body data-page="manage">
    <main class="page-shell">
      <nav class="topbar" aria-label="Điều hướng chính">
        <div class="nav-links">
          <a href="index.html">Hôm nay</a>
          <a href="week.html">Cả tuần</a>
          <a class="active" href="manage.html" aria-current="page">Quản lý</a>
        </div>
      </nav>

      <section class="manage-section" aria-labelledby="manage-heading">
        <div class="manage-heading">
          <p class="kicker">Kế hoạch của tôi</p>
          <h1 id="manage-heading">Quản lý dữ liệu</h1>
          <p>Chọn một thao tác bên dưới. Dữ liệu chỉ được lưu trên trình duyệt hiện tại.</p>
        </div>

        <div class="manage-grid">
          <article class="manage-card restore-card">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4v6h6M5.6 15a7 7 0 1 0 1.3-7.8L4 10" /></svg>
            <div>
              <h2>Khôi phục mẫu</h2>
              <p>Xóa kế hoạch đã import và quay về lịch mặc định.</p>
            </div>
            <button id="restore-plan" class="manage-button restore-action" type="button">Khôi phục kế hoạch</button>
          </article>

          <article class="manage-card import-card">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3" /></svg>
            <div>
              <h2>Import JSON</h2>
              <p>Chọn một file JSON để thay kế hoạch đang sử dụng.</p>
            </div>
            <label class="manage-button import-action" for="plan-file">Chọn file JSON</label>
            <input id="plan-file" class="visually-hidden" type="file" accept="application/json,.json" />
          </article>
        </div>
      </section>

      <p id="import-status" class="toast" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
